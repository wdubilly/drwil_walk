name: ia-first
on:
  # push limité à la branche principale : une branche avec PR n'est jouée que par pull_request (pas de doublon).
  push:
    branches: [master]
  pull_request:
# Un push qui rend un run périmé l'annule, jamais un run de la branche principale.
concurrency:
  group: ia-first-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  # Before anything is played: is this run skipped (QUA-263, QUA-250 proof) and which slices do the sharded checks need (`shards: N`, never in the YAML).
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip: ${{ steps.pr.outputs.skip == 'true' || steps.proven.outputs.skip == 'true' }}
      matrix: ${{ steps.plan.outputs.matrix || '{"include":[]}' }}
      count: ${{ steps.plan.outputs.count || '0' }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      # QUA-263: a push on a branch whose pull request is open would replay what the pull request plays: its steps are skipped, and the
      # skip is said. No job-level `if` (a skipped job is not reported under its name). No pull request, or GitHub mute: tested; main and tags never skipped.
      - id: pr
        env: { GH_TOKEN: "${{ github.token }}", EVENT: "${{ github.event_name }}", REF: "${{ github.ref }}", MAIN: "${{ github.event.repository.default_branch }}", BRANCH: "${{ github.ref_name }}" }
        run: |
          skip=false
          if [ "$EVENT" = push ] && [[ "$REF" == refs/heads/* ]] && [ "$REF" != "refs/heads/$MAIN" ]; then
            open=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open --json number --jq length) || open=0
            if [ "$open" != "0" ]; then skip=true; echo "::notice::Push skipped: the open pull request of $BRANCH already runs these checks."; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # A push on the main branch whose tree is the one the last green pull request CI played (its `proven-tree` artifact) does not replay
      # the checks, and says so; anything missing (no pull request, CI not green, artifact expired, different tree) replays everything.
      - name: Is the tree already proven by the last green pull request CI?
        id: proven
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env: { GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}", COMMIT: "${{ github.sha }}" }
        run: |
          skip=false
          tree=$(git rev-parse 'HEAD^{tree}')
          for head in $(gh api "repos/$REPO/commits/$COMMIT/pulls" --jq '.[].head.sha' 2>/dev/null); do
            run=$(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request&per_page=100" --jq '[.workflow_runs[] | select(.path | startswith(".github/workflows/ia-first.yml"))] | sort_by(.created_at) | last | select(.conclusion == "success") | .id' 2>/dev/null) || continue
            [ -n "$run" ] || continue
            rm -rf "$RUNNER_TEMP/proof"
            gh run download "$run" --repo "$REPO" --name proven-tree --dir "$RUNNER_TEMP/proof" 2>/dev/null || continue
            if [ "$(cat "$RUNNER_TEMP/proof/proven-tree.txt" 2>/dev/null)" = "$tree" ]; then
              skip=true
              echo "::notice::Checks not replayed: tree $tree is the one the green pull request CI (run $run) proved."
              break
            fi
          done
          [ "$skip" = true ] || echo "Tree not proven by a green pull request CI: everything is replayed."
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.skip != 'true' && steps.proven.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with: { node-version: 24 }
      # No sharded check: empty matrix, count 0, no slices job. A declaration the engine refuses fails this job (QUA-013), never "no slice".
      # QUA-250: the previous run of this pull request is read first (its slow verdicts, replayed at the least doubt): no slice is planned for what it settled.
      - name: Plan the slices of the sharded checks
        id: plan
        if: steps.pr.outputs.skip != 'true' && steps.proven.outputs.skip != 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          node .githooks/run-checks.mjs --pr-previous >> "$GITHUB_OUTPUT"
          matrix=$(node .githooks/run-checks.mjs --shard-plan)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<< "$matrix")" >> "$GITHUB_OUTPUT"
  # One job per slice. A pull request plays it with the main branch's hooks (QUA-113); its verdict is an artifact the aggregation reads.
  shards:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.count != '0'
    name: shard ${{ matrix.index }}/${{ matrix.total }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    strategy: { fail-fast: false, matrix: "${{ fromJSON(needs.plan.outputs.matrix) }}" }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Cache npm dérivé des verrous : une dépendance modifiée change la clé, rien n'est masqué.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      # Le seul contrôle découpé est l'e2e (QUA-020) : sans les dépendances de app/ ni navigateur, il serait « non exécuté » (QUA-013).
      # Ces installations sont de ce projet, ajoutées à la main dans le modèle du job (aucune zone du kit n'est dans ce job).
      - name: Install the app layer's dependencies
        run: npm ci
        working-directory: app
      # Chromium seul, à la version épinglée par @playwright/test (app/package-lock.json), avec ses dépendances système.
      # Le cache ne garde que les binaires du navigateur ; la clé suit app/package-lock.json (version de Playwright),
      # et l'installation ci-dessous reste lancée (elle ne retélécharge rien si le cache est présent).
      - name: Cache the Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
      - name: Install the e2e browser (Playwright Chromium)
        run: npx playwright install --with-deps chromium
        working-directory: app
      - name: Play the slice
        env: { EVENT: "${{ github.event_name }}", BASE_REF: "${{ github.base_ref }}", SLICE: "${{ matrix.index }}/${{ matrix.total }}" }
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="origin/$BASE_REF"
            git show "$base:.githooks/base-checks.mjs" > "$RUNNER_TEMP/base-checks.mjs" 2>/dev/null || cp .githooks/base-checks.mjs "$RUNNER_TEMP/base-checks.mjs"
            node "$RUNNER_TEMP/base-checks.mjs" --base "$base" --shard "$SLICE"
          else
            node .githooks/run-checks.mjs --shard "$SLICE"
          fi
      # Even after a failure: a failed slice leaves its verdict "fail"; one that left none is missing for the aggregation.
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "shard-${{ matrix.index }}-of-${{ matrix.total }}", path: .drwil/evidence/shards, overwrite: true }
      # Les captures de l'accueil prises par l'e2e (QUA-020), à télécharger : le demandeur n'a pas de casque
      # et juge le rendu dessus. Publiées même si un contrôle échoue ; une par tranche (noms distincts).
      - name: Publish the home screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-accueil-${{ matrix.index }}-of-${{ matrix.total }}
          path: dist/e2e-captures/
          if-no-files-found: warn
  # The job the branch protection requires, name unchanged (QUA-251); it aggregates the slices, and fails if the plan or a slice did not succeed (QUA-013).
  checks:
    needs: [plan, shards]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Refuse a plan or a slice that did not succeed
        env: { PLAN: "${{ needs.plan.result }}", SHARDS: "${{ needs.shards.result }}", SKIP: "${{ needs.plan.outputs.skip }}", COUNT: "${{ needs.plan.outputs.count }}" }
        run: |
          [ "$PLAN" = success ] || { echo "::error::The plan job did not succeed ($PLAN): the slices of the sharded checks are unknown."; exit 1; }
          [ "$SKIP" = true ] || [ "$COUNT" = 0 ] || [ "$SHARDS" = success ] || { echo "::error::The slices job did not succeed ($SHARDS)."; exit 1; }
      - if: needs.plan.outputs.skip != 'true'
        uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - if: needs.plan.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Cache npm dérivé des verrous : une dépendance modifiée change la clé, rien n'est masqué.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      # Without gitleaks the secrets check is "not run", which fails run-checks in CI (QUA-013): pinned version, archive checked against its sum, cached.
      - name: Restore the gitleaks archive
        if: needs.plan.outputs.skip != 'true'
        uses: actions/cache@v6
        with: { path: "${{ runner.temp }}/gitleaks.tar.gz", key: gitleaks-8.21.2-linux-x64 }
      - name: Install gitleaks 8.21.2
        if: needs.plan.outputs.skip != 'true'
        run: |
          a="$RUNNER_TEMP/gitleaks.tar.gz"
          [ -s "$a" ] || curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 120 -o "$a" https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | (cd "$RUNNER_TEMP" && sha256sum -c -)
          mkdir -p ~/.local/bin && tar -xzf "$a" -C ~/.local/bin gitleaks
          ~/.local/bin/gitleaks version
      # Installations du projet, ajoutées à la main avant l'agrégation : la zone `steps` du kit est en fin de job, après run-checks,
      # trop tard pour des outils que les contrôles lisent. Pas de Chromium ici : l'e2e est joué par les tranches, jamais par ce job.
      # Le contrôle coverage-diff-app (QUA-004) lit le rapport de c8 avec diff-cover, outil Python : sans lui,
      # le contrôle serait « non exécuté » (QUA-013). Version épinglée ; pipx est fourni par ubuntu-latest.
      # Il compare à origin/master : l'historique complet vient de fetch-depth: 0 ci-dessus.
      - name: Install diff-cover 10.6.0
        if: needs.plan.outputs.skip != 'true'
        run: |
          pipx install diff-cover==10.6.0
          diff-cover --version
      # Les contrôles de la couche app (coverage-app, typecheck-app, lint-app, licenses-app) tournent
      # depuis app/ : sans ses dépendances, ils seraient « non exécutés », ce qui fait échouer
      # run-checks en CI (QUA-013). npm ci : versions verrouillées par app/package-lock.json.
      - name: Install the app layer's dependencies
        if: needs.plan.outputs.skip != 'true'
        run: npm ci
        working-directory: app
      # QUA-250: a pull request restores the main branch's last verdicts and run-checks reuses each "ok" check whose fingerprint is
      # unchanged; only a push on the main branch (everything replayed) saves them. Without a restored cache, everything is replayed.
      - name: Restore the verdicts of the main branch's CI
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with: { path: .drwil/evidence/run-checks-verdicts.json, key: "run-checks-verdicts-${{ github.event.pull_request.base.sha }}", restore-keys: run-checks-verdicts- }
      # Sharded checks are judged on the slices' verdicts (`--aggregate-shards`): every slice of this commit "ok", none missing.
      - name: Download the slices' verdicts
        if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.count != '0'
        uses: actions/download-artifact@v4
        with: { pattern: "shard-*", merge-multiple: true, path: .drwil/evidence/shards }
      # QUA-250: the very run the plan read (never another), then the verdicts of this pass for the next push; run-checks judges them all.
      - if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.previous != ''
        env: { GH_TOKEN: "${{ github.token }}", PREVIOUS: "${{ needs.plan.outputs.previous }}" }
        run: node .githooks/run-checks.mjs --pr-previous "$PREVIOUS"
      # GitHub sets CI: run-checks also plays the checks left to CI (`runAt: ["ci"]`, QUA-208), proved only by this run (QUA-262).
      - if: needs.plan.outputs.skip != 'true'
        run: node .githooks/run-checks.mjs --aggregate-shards .drwil/evidence/shards
        env:
          DRWIL_CI_REUSE: ${{ github.event_name == 'pull_request' && '1' || '' }}
      - name: Save the main branch's verdicts
        if: always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && hashFiles('.drwil/evidence/run-checks-verdicts.json') != ''
        uses: actions/cache/save@v6
        with: { path: .drwil/evidence/run-checks-verdicts.json, key: "run-checks-verdicts-${{ github.sha }}" }
      # QUA-113: a pull request is replayed with the main branch's hooks (read through Git) and the PR's list of checks: a PR that weakens
      # a hook or removes a check does not validate itself. The PR's base-checks.mjs runs only while the main branch has none (adoption).
      - name: Replay the checks with the main branch's hooks
        if: github.event_name == 'pull_request'
        env: { BASE_REF: "${{ github.base_ref }}" }
        run: |
          base="origin/$BASE_REF"
          git show "$base:.githooks/base-checks.mjs" > "$RUNNER_TEMP/base-checks.mjs" 2>/dev/null || cp .githooks/base-checks.mjs "$RUNNER_TEMP/base-checks.mjs"
          node "$RUNNER_TEMP/base-checks.mjs" --base "$base" --aggregate-shards .drwil/evidence/shards
      - if: github.event_name == 'pull_request' && always() && hashFiles('.drwil/evidence/pr-verdicts/pr-verdicts.json') != ''
        uses: actions/upload-artifact@v4
        with: { name: pr-verdicts, path: .drwil/evidence/pr-verdicts, retention-days: 14, overwrite: true }
      # Read by the push on the main branch (step "Is the tree already proven…"): last, so only if every step succeeded.
      - name: Record the tree proven by this CI
        if: github.event_name == 'pull_request'
        run: git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/proven-tree.txt"
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with: { name: proven-tree, path: "${{ runner.temp }}/proven-tree.txt" }
      # drwil-project-begin steps
      # Steps of the project: kept as they are by `drwil init`, which rewrites everything outside the two zones.
      # drwil-project-end steps
  # drwil-project-begin jobs
  # drwil-project-end jobs
  # No branch protection is possible on a private repository on the free plan
  # (GitHub.com's "Merge" button stays unconditional): only an after-the-fact
  # alert is possible. Triggers only on a push to the main branch (not on
  # pull/merge requests) and only if `checks` failed; opens no duplicate if an
  # equivalent issue is already open.
  alert-if-ci-broken:
    needs: checks
    if: always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.checks.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue if CI breaks on the main branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="CI broken on the main branch (run ${{ github.run_id }})"
          open=$(gh issue list --repo "${{ github.repository }}" --search "CI broken on the main branch in:title" --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$title" \
              --body "The \`checks\` job failed on the main branch (${{ github.event.repository.default_branch }}). See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. To fix before any new workstream."
          else
            echo "A broken-CI issue is already open, no duplicate."
          fi
